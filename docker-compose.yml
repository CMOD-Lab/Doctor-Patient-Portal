version: "3.9"

services:
  doctor-patient-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: doctor-patient-portal:latest
    container_name: doctor-patient-portal
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      # MySQL connection – supply via .env or override at runtime
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-hospital}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      # Redis / ElastiCache connection
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      - ./config:/opt/tomcat/conf/extra:ro
      - app-logs:/opt/tomcat/logs
    networks:
      - app-network
    restart: unless-stopped

volumes:
  app-logs:

networks:
  app-network:
    driver: bridge
