# =============================================================================
# application.properties
# Cloud Readiness Fix: cr-java-0065 - HTTP Session State Storage
# =============================================================================
# Spring Session is configured to use Redis (Amazon ElastiCache) as the
# centralized session store. This replaces in-memory HTTP session storage,
# enabling stateless application instances and horizontal scaling.
# =============================================================================

# ---------------------------------------------------------------------------
# Spring Session - Redis Store Configuration
# ---------------------------------------------------------------------------
# Instructs Spring Session to use Redis as the session repository.
# The SpringSessionRepositoryFilter intercepts all HttpSession API calls
# and delegates storage to the ElastiCache Redis cluster.
spring.session.store-type=redis

# Session timeout (30 minutes). Stored as TTL in Redis.
spring.session.timeout=1800s

# Redis key namespace prefix for session data
spring.session.redis.namespace=spring:session:hms

# ---------------------------------------------------------------------------
# Redis Connection - Amazon ElastiCache
# ---------------------------------------------------------------------------
# Connection parameters are read from environment variables following
# 12-factor app configuration principles. Set these in your deployment
# environment (ECS task definition, Elastic Beanstalk env vars, etc.).
#
# REDIS_HOST     - ElastiCache primary endpoint (e.g., my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
# REDIS_PORT     - ElastiCache port (default: 6379)
# REDIS_PASSWORD - ElastiCache AUTH token (if in-transit encryption is enabled)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# ---------------------------------------------------------------------------
# Redis Connection Pool (Lettuce)
# ---------------------------------------------------------------------------
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2
spring.redis.lettuce.pool.max-wait=-1ms
