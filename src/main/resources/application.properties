# Database Configuration for HikariCP Connection Pool
# These values should be configured via environment variables in production

# Database connection settings
# For AWS RDS, use the RDS endpoint
db.url=${DB_URL:jdbc:mysql://localhost:3306/hospital}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:wasim}
db.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# HikariCP connection pool settings
db.hikari.maximumPoolSize=${DB_POOL_MAX_SIZE:10}
db.hikari.minimumIdle=${DB_POOL_MIN_IDLE:5}
db.hikari.connectionTimeout=${DB_CONNECTION_TIMEOUT:30000}
db.hikari.idleTimeout=${DB_IDLE_TIMEOUT:600000}
db.hikari.maxLifetime=${DB_MAX_LIFETIME:1800000}
db.hikari.autoCommit=${DB_AUTO_COMMIT:true}

# MySQL JDBC Driver Network Timeout Settings (for cloud environments)
# Prevents indefinite hangs on network failures
db.connectTimeout=${DB_CONNECT_TIMEOUT:10000}
db.socketTimeout=${DB_SOCKET_TIMEOUT:30000}

# AWS RDS Configuration Notes:
# For AWS RDS MySQL:
# 1. Set DB_URL to your RDS endpoint (e.g., jdbc:mysql://mydb.abc123.us-east-1.rds.amazonaws.com:3306/hospital)
# 2. Set DB_USERNAME and DB_PASSWORD from AWS Secrets Manager
# 3. For RDS Proxy, use the proxy endpoint instead of direct RDS endpoint
# 4. Ensure security groups allow traffic from your application to RDS
# 5. Consider using IAM database authentication for enhanced security

# ============================================================================
# Spring Session Redis Configuration for AWS ElastiCache
# These values should be configured via environment variables in production

# Redis connection settings
# For AWS ElastiCache, use the cluster endpoint
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=2000ms

# Redis connection pool settings (Lettuce)
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# Spring Session configuration
spring.session.store-type=redis
spring.session.redis.namespace=hms:session
spring.session.timeout=1800s

# AWS ElastiCache Configuration Notes:
# 
# For AWS ElastiCache Redis:
# 1. Set REDIS_HOST to your ElastiCache cluster endpoint (e.g., my-cluster.abc123.0001.use1.cache.amazonaws.com)
# 2. Set REDIS_PORT to 6379 (default) or your custom port
# 3. For encrypted connections, set REDIS_SSL=true
# 4. If using AUTH, set REDIS_PASSWORD to your Redis AUTH token
# 5. Ensure security groups allow traffic from your application to ElastiCache
#
# Example environment variables for production:
# REDIS_HOST=hms-session-cache.abc123.0001.use1.cache.amazonaws.com
# REDIS_PORT=6379
# REDIS_SSL=true
# REDIS_PASSWORD=your-auth-token
