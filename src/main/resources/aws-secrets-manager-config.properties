# AWS Secrets Manager Configuration
# This file documents the environment variables and AWS Secrets Manager setup required for the application

# AWS Region for Secrets Manager
# Set this environment variable to specify the AWS region where your secrets are stored
# Default: us-east-1
# AWS_REGION=us-east-1

# AWS Credentials Configuration
# The application uses AWS SDK DefaultCredentialsProvider which checks credentials in this order:
# 1. Environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
# 2. Java system properties (aws.accessKeyId, aws.secretAccessKey)
# 3. AWS credentials file (~/.aws/credentials)
# 4. IAM role for EC2/ECS/Lambda (recommended for production)

# Required Secrets in AWS Secrets Manager:
# 
# 1. Database Credentials Secret
#    Secret Name: hms/database/credentials
#    Secret Value (JSON format):
#    {
#      "username": "your-db-username",
#      "password": "your-db-password",
#      "host": "your-db-host",
#      "port": "3306",
#      "database": "hospital"
#    }
#
# 2. API Keys and Tokens (if applicable)
#    Secret Name: hms/api/keys
#    Secret Value (JSON format):
#    {
#      "apiKey": "your-api-key",
#      "authToken": "your-auth-token"
#    }

# Setup Instructions:
# 
# 1. Create secrets in AWS Secrets Manager:
#    aws secretsmanager create-secret \
#      --name hms/database/credentials \
#      --description "Database credentials for Hospital Management System" \
#      --secret-string '{"username":"dbuser","password":"dbpass","host":"localhost","port":"3306","database":"hospital"}'
#
# 2. Grant IAM permissions to your application:
#    - For EC2: Attach IAM role with secretsmanager:GetSecretValue permission
#    - For ECS: Attach task execution role with secretsmanager:GetSecretValue permission
#    - For local development: Configure AWS CLI with appropriate credentials
#
# 3. Enable automatic secret rotation (recommended):
#    aws secretsmanager rotate-secret \
#      --secret-id hms/database/credentials \
#      --rotation-lambda-arn arn:aws:lambda:region:account:function:rotation-function \
#      --rotation-rules AutomaticallyAfterDays=30

# Security Best Practices:
# - Never commit actual credentials to source control
# - Use IAM roles for applications running in AWS (EC2, ECS, Lambda)
# - Enable CloudTrail logging for secret access auditing
# - Implement automatic secret rotation
# - Use least privilege IAM policies
# - Encrypt secrets at rest (enabled by default in Secrets Manager)
